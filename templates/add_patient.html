<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Patient - Hospital Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* Consistent gradient color scheme */
        .bg-primary, .btn-primary {
            background: linear-gradient(180deg, #2c3e50 0%, #34495e 100%) !important;
            border-color: #2c3e50 !important;
        }
        .bg-success, .btn-success {
            background: linear-gradient(180deg, #2c3e50 0%, #34495e 100%) !important;
            border-color: #2c3e50 !important;
        }
        .bg-info, .btn-info {
            background: linear-gradient(180deg, #2c3e50 0%, #34495e 100%) !important;
            border-color: #2c3e50 !important;
        }
        .bg-warning, .btn-warning {
            background: linear-gradient(180deg, #2c3e50 0%, #34495e 100%) !important;
            border-color: #2c3e50 !important;
        }
        .bg-secondary, .btn-secondary {
            background: linear-gradient(180deg, #2c3e50 0%, #34495e 100%) !important;
            border-color: #2c3e50 !important;
        }
        .bg-danger, .btn-danger {
            background: linear-gradient(180deg, #2c3e50 0%, #34495e 100%) !important;
            border-color: #2c3e50 !important;
        }
        .bg-dark, .btn-dark {
            background: linear-gradient(180deg, #2c3e50 0%, #34495e 100%) !important;
            border-color: #2c3e50 !important;
        }
        .btn-outline-primary {
            color: #2c3e50 !important;
            border-color: #2c3e50 !important;
        }
        .btn-outline-primary:hover {
            background: linear-gradient(180deg, #2c3e50 0%, #34495e 100%) !important;
            color: white !important;
        }
        .btn-outline-secondary {
            color: #2c3e50 !important;
            border-color: #2c3e50 !important;
        }
        .btn-outline-secondary:hover {
            background: linear-gradient(180deg, #2c3e50 0%, #34495e 100%) !important;
            color: white !important;
        }
        .card-header.bg-primary {
            background: linear-gradient(180deg, #2c3e50 0%, #34495e 100%) !important;
        }
        .navbar-dark.bg-primary {
            background: linear-gradient(180deg, #2c3e50 0%, #34495e 100%) !important;
        }
        /* Hover effects for all buttons */
        .btn-primary:hover, .btn-success:hover, .btn-info:hover, .btn-warning:hover, .btn-secondary:hover, .btn-danger:hover, .btn-dark:hover {
            background: linear-gradient(180deg, #34495e 0%, #2c3e50 100%) !important;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(44, 62, 80, 0.3);
        }
    </style>
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('index') }}">
                <i class="fas fa-hospital me-2"></i>Hospital Management System
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="{{ url_for('index') }}">Dashboard</a>
                <a class="nav-link" href="{{ url_for('add_doctor') }}">Add Doctor</a>
                <a class="nav-link" href="{{ url_for('add_appointment') }}">Schedule Appointment</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">
                            <i class="fas fa-user-plus me-2"></i>Add New Patient
                        </h4>
                    </div>
                    <div class="card-body">
                        <form method="POST" action="{{ url_for('add_patient') }}">
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="name" class="form-label">Full Name *</label>
                                        <input type="text" class="form-control" id="name" name="name" required>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="age" class="form-label">Age</label>
                                        <input type="number" class="form-control" id="age" name="age" min="0" max="150">
                                    </div>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="gender" class="form-label">Gender</label>
                                        <select class="form-select" id="gender" name="gender">
                                            <option value="">Select Gender</option>
                                            <option value="Male">Male</option>
                                            <option value="Female">Female</option>
                                            <option value="Other">Other</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="blood_type" class="form-label">Blood Type</label>
                                        <select class="form-select" id="blood_type" name="blood_type">
                                            <option value="">Select Blood Type</option>
                                            <option value="A+">A+</option>
                                            <option value="A-">A-</option>
                                            <option value="B+">B+</option>
                                            <option value="B-">B-</option>
                                            <option value="AB+">AB+</option>
                                            <option value="AB-">AB-</option>
                                            <option value="O+">O+</option>
                                            <option value="O-">O-</option>
                                        </select>
                                    </div>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="contact_number" class="form-label">Contact Number</label>
                                        <input type="tel" class="form-control" id="contact_number" name="contact_number" 
                                               placeholder="+1-555-0123">
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="emergency_phone" class="form-label">Emergency Phone</label>
                                        <input type="tel" class="form-control" id="emergency_phone" name="emergency_phone" 
                                               placeholder="+1-555-0123">
                                    </div>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="address" class="form-label">Address</label>
                                <textarea class="form-control" id="address" name="address" rows="2" 
                                          placeholder="Enter patient's address..."></textarea>
                            </div>

                            <div class="mb-3">
                                <label for="emergency_contact" class="form-label">Emergency Contact Person</label>
                                <input type="text" class="form-control" id="emergency_contact" name="emergency_contact" 
                                       placeholder="Name of emergency contact person">
                            </div>

                            <div class="mb-3">
                                <label for="allergies" class="form-label">Allergies</label>
                                <textarea class="form-control" id="allergies" name="allergies" rows="2" 
                                          placeholder="List any known allergies (e.g., Penicillin, Latex, etc.)"></textarea>
                            </div>

                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary btn-lg">
                                    <i class="fas fa-save me-2"></i>Register Patient
                                </button>
                                <a href="{{ url_for('index') }}" class="btn btn-outline-secondary">
                                    <i class="fas fa-arrow-left me-2"></i>Back to Dashboard
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
