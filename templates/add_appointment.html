<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule Appointment - Hospital Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* Consistent gradient color scheme */
        .bg-primary, .btn-primary {
            background: linear-gradient(180deg, #2c3e50 0%, #34495e 100%) !important;
            border-color: #2c3e50 !important;
        }
        .bg-success, .btn-success {
            background: linear-gradient(180deg, #2c3e50 0%, #34495e 100%) !important;
            border-color: #2c3e50 !important;
        }
        .bg-info, .btn-info {
            background: linear-gradient(180deg, #2c3e50 0%, #34495e 100%) !important;
            border-color: #2c3e50 !important;
        }
        .bg-warning, .btn-warning {
            background: linear-gradient(180deg, #2c3e50 0%, #34495e 100%) !important;
            border-color: #2c3e50 !important;
        }
        .bg-secondary, .btn-secondary {
            background: linear-gradient(180deg, #2c3e50 0%, #34495e 100%) !important;
            border-color: #2c3e50 !important;
        }
        .bg-danger, .btn-danger {
            background: linear-gradient(180deg, #2c3e50 0%, #34495e 100%) !important;
            border-color: #2c3e50 !important;
        }
        .bg-dark, .btn-dark {
            background: linear-gradient(180deg, #2c3e50 0%, #34495e 100%) !important;
            border-color: #2c3e50 !important;
        }
        .btn-outline-primary {
            color: #2c3e50 !important;
            border-color: #2c3e50 !important;
        }
        .btn-outline-primary:hover {
            background: linear-gradient(180deg, #2c3e50 0%, #34495e 100%) !important;
            color: white !important;
        }
        .btn-outline-secondary {
            color: #2c3e50 !important;
            border-color: #2c3e50 !important;
        }
        .btn-outline-secondary:hover {
            background: linear-gradient(180deg, #2c3e50 0%, #34495e 100%) !important;
            color: white !important;
        }
        .card-header.bg-primary {
            background: linear-gradient(180deg, #2c3e50 0%, #34495e 100%) !important;
        }
        .navbar-dark.bg-primary {
            background: linear-gradient(180deg, #2c3e50 0%, #34495e 100%) !important;
        }
        /* Hover effects for all buttons */
        .btn-primary:hover, .btn-success:hover, .btn-info:hover, .btn-warning:hover, .btn-secondary:hover, .btn-danger:hover, .btn-dark:hover {
            background: linear-gradient(180deg, #34495e 0%, #2c3e50 100%) !important;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(44, 62, 80, 0.3);
        }
    </style>
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('index') }}">
                <i class="fas fa-hospital me-2"></i>Hospital Management System
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="{{ url_for('index') }}">Dashboard</a>
                <a class="nav-link" href="{{ url_for('add_patient') }}">Add Patient</a>
                <a class="nav-link" href="{{ url_for('add_doctor') }}">Add Doctor</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow">
                    <div class="card-header bg-info text-white">
                        <h4 class="mb-0">
                            <i class="fas fa-calendar-plus me-2"></i>Schedule New Appointment
                        </h4>
                    </div>
                    <div class="card-body">
                        <form method="POST" action="{{ url_for('add_appointment') }}">
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="patient_id" class="form-label">Select Patient *</label>
                                        <select class="form-select" id="patient_id" name="patient_id" required>
                                            <option value="">Choose a patient</option>
                                            {% for patient in patients %}
                                            <option value="{{ patient.id }}">{{ patient.name }} ({{ patient.age }}, {{ patient.gender }})</option>
                                            {% endfor %}
                                        </select>
                                        {% if not patients %}
                                        <div class="form-text text-danger">No patients available. Please add a patient first.</div>
                                        {% endif %}
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="doctor_id" class="form-label">Select Doctor *</label>
                                        <select class="form-select" id="doctor_id" name="doctor_id" required>
                                            <option value="">Choose a doctor</option>
                                            {% for doctor in doctors %}
                                            <option value="{{ doctor.id }}">{{ doctor.name }} ({{ doctor.specialization }})</option>
                                            {% endfor %}
                                        </select>
                                        {% if not doctors %}
                                        <div class="form-text text-danger">No doctors available. Please add a doctor first.</div>
                                        {% endif %}
                                    </div>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="date" class="form-label">Appointment Date *</label>
                                        <input type="date" class="form-control" id="date" name="date" required>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="time" class="form-label">Appointment Time</label>
                                        <input type="time" class="form-control" id="time" name="time">
                                    </div>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="diagnosis" class="form-label">Diagnosis Notes</label>
                                <textarea class="form-control" id="diagnosis" name="diagnosis" rows="3" 
                                          placeholder="Enter diagnosis or symptoms..."></textarea>
                            </div>

                            <div class="mb-3">
                                <label for="notes" class="form-label">Additional Notes</label>
                                <textarea class="form-control" id="notes" name="notes" rows="2" 
                                          placeholder="Enter any additional notes or special instructions..."></textarea>
                            </div>

                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-info btn-lg" {% if not patients or not doctors %}disabled{% endif %}>
                                    <i class="fas fa-calendar-check me-2"></i>Schedule Appointment
                                </button>
                                <a href="{{ url_for('index') }}" class="btn btn-outline-secondary">
                                    <i class="fas fa-arrow-left me-2"></i>Back to Dashboard
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Set minimum date to today
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('date').min = today;
    </script>
</body>
</html>
