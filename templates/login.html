<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Xwepo Hospital Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" onerror="this.onerror=null;this.href='{{ url_for('static', filename='libs/bootstrap/bootstrap.min.css') }}'">
    <link href="{{ url_for('static', filename='libs/fontawesome/css/all.min.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/color-scheme.css') }}" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, var(--primary-teal-light) 0%, var(--primary-teal) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        .login-card {
            background: var(--white);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(44, 166, 154, 0.2);
            border: 1px solid var(--primary-teal-light);
        }
        .form-control {
            border-radius: 10px;
            border: 2px solid #e9ecef;
            padding: 12px 15px;
            transition: all 0.3s ease;
        }
        .form-control:focus {
            border-color: var(--primary-teal);
            box-shadow: 0 0 0 0.2rem rgba(44, 166, 154, 0.25);
        }
        .btn-login {
            background: var(--primary-teal);
            border: none;
            border-radius: 10px;
            padding: 12px 30px;
            font-weight: 600;
            transition: all 0.3s ease;
            color: var(--white);
        }
        .btn-login:hover {
            background: var(--primary-teal-dark);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(44, 166, 154, 0.3);
            color: var(--white);
        }
        .btn-outline-primary {
            color: var(--primary-teal) !important;
            border-color: var(--primary-teal) !important;
            background-color: transparent !important;
        }
        .btn-outline-primary:hover {
            color: var(--white) !important;
            background-color: var(--primary-teal) !important;
            border-color: var(--primary-teal) !important;
        }
        .btn-outline-primary.btn-login {
            color: var(--primary-teal) !important;
            background-color: transparent !important;
            border: 2px solid var(--primary-teal) !important;
        }
        .btn-outline-primary.btn-login:hover {
            color: var(--white) !important;
            background-color: var(--primary-teal) !important;
            border-color: var(--primary-teal) !important;
        }
        .form-label {
            color: var(--dark-gray);
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                <div class="card login-card border-0">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <img src="{{ url_for('static', filename='images/xwepo_logo.png') }}" alt="Xwepo Hospital Management System" class="img-fluid mb-3" style="max-height: 200px; width: auto;">
                            <h4 class="text-dark mb-0 fw-bold">Xwepo</h4>
                            <p class="text-muted mb-2">Hospital Management System</p>
                            <p class="text-muted mt-2">Sign in to your account</p>
                        </div>

                        {% with messages = get_flashed_messages(with_categories=true) %}
                            {% if messages %}
                                {% for category, message in messages %}
                                    <div class="alert alert-{{ 'danger' if category == 'error' else category }} alert-dismissible fade show" role="alert">
                                        <i class="fas fa-{{ 'exclamation-triangle' if category == 'error' else 'check-circle' }} me-2"></i>
                                        {{ message }}
                                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                                    </div>
                                {% endfor %}
                            {% endif %}
                        {% endwith %}

                        <form method="POST" action="{{ url_for('login') }}">
                            <div class="mb-3">
                                <label for="username" class="form-label text-dark fw-semibold">
                                    <i class="fas fa-user me-2"></i>Username
                                </label>
                                <input type="text" class="form-control" id="username" name="username" required>
                            </div>
                            <div class="mb-4">
                                <label for="password" class="form-label text-dark fw-semibold">
                                    <i class="fas fa-lock me-2"></i>Password
                                </label>
                                <input type="password" class="form-control" id="password" name="password" required>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary btn-login">
                                    <i class="fas fa-sign-in-alt me-2"></i>Sign In
                                </button>
                            </div>

                            <div class="d-grid mt-3">
                                <a href="{{ url_for('register') }}" class="btn btn-primary btn-login">
                                    <i class="fas fa-user-plus me-2"></i>Create New Account
                                </a>
                            </div>
                            
                            <div class="d-grid mt-3">
                                <a href="{{ url_for('link_doctor_account') }}" class="btn btn-outline-primary btn-login">
                                    <i class="fas fa-user-md me-2"></i>Link Doctor Account
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" onerror="this.onerror=null;this.src='{{ url_for('static', filename='libs/bootstrap/bootstrap.bundle.min.js') }}'"></script>
    <script src="{{ url_for('static', filename='js/theme-switcher.js') }}"></script>

</body>
</html>
