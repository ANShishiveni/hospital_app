<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Medical Record - Hospital Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" onerror="this.onerror=null;this.href='{{ url_for('static', filename='libs/bootstrap/bootstrap.min.css') }}'">
    <link href="{{ url_for('static', filename='libs/fontawesome/css/all.min.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/color-scheme.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/color-scheme.css') }}" rel="stylesheet">
        <style>
        .card {
            border-radius: 15px;
            border: none;
            box-shadow: 0 5px 15px rgba(44, 166, 154, 0.1);
            background: var(--white);
        }
        .btn-action {
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 0.875rem;
        }
    </style>
</head>
<body style="background-color: var(--light-gray);">
    <nav class="navbar navbar-expand-lg navbar-dark" style="background-color: var(--primary-teal-dark);">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="{{ url_for('index') }}">
                <img src="{{ url_for('static', filename='images/xwepo_logo.png') }}" alt="Xwepo" class="me-2" style="height: 30px;">
                <span>Xwepo</span>
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="{{ url_for('index') }}">Dashboard</a>
                <a class="nav-link" href="{{ url_for('add_patient') }}">Add Patient</a>
                <a class="nav-link" href="{{ url_for('add_doctor') }}">Add Doctor</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">
                            <i class="fas fa-upload me-2"></i>Upload Medical Record
                        </h4>
                    </div>
                    <div class="card-body">
                        <form method="POST" action="{{ url_for('upload_medical_record') }}" enctype="multipart/form-data">
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="patient_id" class="form-label">Select Patient *</label>
                                        <select class="form-select" id="patient_id" name="patient_id" required>
                                            <option value="">Choose a patient</option>
                                            {% for patient in patients %}
                                            <option value="{{ patient.id }}">{{ patient.name }} ({{ patient.age }}, {{ patient.gender }})</option>
                                            {% endfor %}
                                        </select>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="doctor_id" class="form-label">Select Doctor *</label>
                                        <select class="form-select" id="doctor_id" name="doctor_id" required>
                                            <option value="">Choose a doctor</option>
                                            {% for doctor in doctors %}
                                            <option value="{{ doctor.id }}">{{ doctor.name }} ({{ doctor.specialization }})</option>
                                            {% endfor %}
                                        </select>
                                    </div>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="record_type" class="form-label">Record Type *</label>
                                        <select class="form-select" id="record_type" name="record_type" required>
                                            <option value="">Select record type</option>
                                            <option value="lab_result">Lab Result</option>
                                            <option value="xray">X-Ray</option>
                                            <option value="mri">MRI Scan</option>
                                            <option value="ct_scan">CT Scan</option>
                                            <option value="blood_test">Blood Test</option>
                                            <option value="urine_test">Urine Test</option>
                                            <option value="ecg">ECG</option>
                                            <option value="ultrasound">Ultrasound</option>
                                            <option value="biopsy">Biopsy Report</option>
                                            <option value="other">Other</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="file" class="form-label">Select File *</label>
                                        <input type="file" class="form-control" id="file" name="file" required 
                                               accept=".pdf,.doc,.docx,.jpg,.jpeg,.png,.gif,.tiff">
                                        <div class="form-text">Supported formats: PDF, DOC, DOCX, JPG, PNG, GIF, TIFF (Max: 16MB)</div>
                                    </div>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="description" class="form-label">Description</label>
                                <textarea class="form-control" id="description" name="description" rows="3" 
                                          placeholder="e.g., Blood test results, X-ray findings, MRI scan report..."></textarea>
                            </div>

                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary btn-lg">
                                    <i class="fas fa-upload me-2"></i>Upload Medical Record
                                </button>
                                <a href="{{ url_for('index') }}" class="btn btn-secondary">
                                    <i class="fas fa-arrow-left me-2"></i>Back to Dashboard
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" onerror="this.onerror=null;this.src='{{ url_for('static', filename='libs/bootstrap/bootstrap.bundle.min.js') }}'"></script>
</body>
</html>
