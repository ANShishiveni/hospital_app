<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Prescription - Hospital Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" onerror="this.onerror=null;this.href='{{ url_for('static', filename='libs/bootstrap/bootstrap.min.css') }}'">
    <link href="{{ url_for('static', filename='libs/fontawesome/css/all.min.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/color-scheme.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/color-scheme.css') }}" rel="stylesheet">
        <style>
        .card {
            border-radius: 15px;
            border: none;
            box-shadow: 0 5px 15px rgba(44, 166, 154, 0.1);
            background: var(--white);
        }
        .btn-action {
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 0.875rem;
        }
    </style>
</head>
<body style="background-color: var(--light-gray);">
    <nav class="navbar navbar-expand-lg navbar-dark" style="background-color: var(--primary-teal-dark);">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="{{ url_for('index') }}">
                <img src="{{ url_for('static', filename='images/xwepo_logo.png') }}" alt="Xwepo" class="me-2" style="height: 30px;">
                <span>Xwepo</span>
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="{{ url_for('index') }}">Dashboard</a>
                <a class="nav-link" href="{{ url_for('add_patient') }}">Add Patient</a>
                <a class="nav-link" href="{{ url_for('add_doctor') }}">Add Doctor</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-header bg-secondary text-white">
                        <h4 class="mb-0">
                            <i class="fas fa-pills me-2"></i>Add New Prescription
                        </h4>
                    </div>
                    <div class="card-body">
                        <form method="POST" action="{{ url_for('add_prescription') }}">
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="patient_id" class="form-label">Select Patient *</label>
                                        <select class="form-select" id="patient_id" name="patient_id" required>
                                            <option value="">Choose a patient</option>
                                            {% for patient in patients %}
                                            <option value="{{ patient.id }}">{{ patient.name }} ({{ patient.age }}, {{ patient.gender }})</option>
                                            {% endfor %}
                                        </select>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="doctor_id" class="form-label">Prescribing Doctor *</label>
                                        <select class="form-select" id="doctor_id" name="doctor_id" required>
                                            <option value="">Choose a doctor</option>
                                            {% for doctor in doctors %}
                                            <option value="{{ doctor.id }}">{{ doctor.name }} ({{ doctor.specialization }})</option>
                                            {% endfor %}
                                        </select>
                                    </div>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="medication_name" class="form-label">Medication Name *</label>
                                        <input type="text" class="form-control" id="medication_name" name="medication_name" required
                                               placeholder="e.g., Amoxicillin, Ibuprofen">
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="dosage" class="form-label">Dosage</label>
                                        <input type="text" class="form-control" id="dosage" name="dosage"
                                               placeholder="e.g., 500mg, 10ml">
                                    </div>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="frequency" class="form-label">Frequency</label>
                                        <select class="form-select" id="frequency" name="frequency">
                                            <option value="">Select frequency</option>
                                            <option value="Once daily">Once daily</option>
                                            <option value="Twice daily">Twice daily</option>
                                            <option value="Three times daily">Three times daily</option>
                                            <option value="Four times daily">Four times daily</option>
                                            <option value="Every 4 hours">Every 4 hours</option>
                                            <option value="Every 6 hours">Every 6 hours</option>
                                            <option value="Every 8 hours">Every 8 hours</option>
                                            <option value="Every 12 hours">Every 12 hours</option>
                                            <option value="As needed">As needed</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="duration" class="form-label">Duration</label>
                                        <input type="text" class="form-control" id="duration" name="duration"
                                               placeholder="e.g., 7 days, 2 weeks">
                                    </div>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="expiry_date" class="form-label">Expiry Date</label>
                                        <input type="date" class="form-control" id="expiry_date" name="expiry_date">
                                        <div class="form-text">Leave blank if no expiry date</div>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="prescribed_date" class="form-label">Prescribed Date</label>
                                        <input type="date" class="form-control" id="prescribed_date" name="prescribed_date" 
                                               value="{{ today }}" readonly>
                                    </div>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="instructions" class="form-label">Instructions</label>
                                                                <textarea class="form-control" id="instructions" name="instructions" rows="3" 
                                          placeholder="e.g., Take 1 tablet twice daily with meals, Avoid alcohol, Store in refrigerator..."></textarea>
                            </div>

                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-secondary btn-lg">
                                    <i class="fas fa-save me-2"></i>Save Prescription
                                </button>
                                <a href="{{ url_for('index') }}" class="btn btn-outline-secondary">
                                    <i class="fas fa-arrow-left me-2"></i>Back to Dashboard
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" onerror="this.onerror=null;this.src='{{ url_for('static', filename='libs/bootstrap/bootstrap.bundle.min.js') }}'"></script>
    <script>
        // Set today's date as default
        document.getElementById('prescribed_date').value = new Date().toISOString().split('T')[0];
    </script>
</body>
</html>
