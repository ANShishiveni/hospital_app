<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Appointment - Hospital Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* Consistent gradient color scheme */
        .bg-primary, .btn-primary {
            background: linear-gradient(180deg, #2c3e50 0%, #34495e 100%) !important;
            border-color: #2c3e50 !important;
        }
        .bg-success, .btn-success {
            background: linear-gradient(180deg, #2c3e50 0%, #34495e 100%) !important;
            border-color: #2c3e50 !important;
        }
        .bg-info, .btn-info {
            background: linear-gradient(180deg, #2c3e50 0%, #34495e 100%) !important;
            border-color: #2c3e50 !important;
        }
        .bg-warning, .btn-warning {
            background: linear-gradient(180deg, #2c3e50 0%, #34495e 100%) !important;
            border-color: #2c3e50 !important;
        }
        .bg-secondary, .btn-secondary {
            background: linear-gradient(180deg, #2c3e50 0%, #34495e 100%) !important;
            border-color: #2c3e50 !important;
        }
        .bg-danger, .btn-danger {
            background: linear-gradient(180deg, #2c3e50 0%, #34495e 100%) !important;
            border-color: #2c3e50 !important;
        }
        .bg-dark, .btn-dark {
            background: linear-gradient(180deg, #2c3e50 0%, #34495e 100%) !important;
            border-color: #2c3e50 !important;
        }
        .btn-outline-primary {
            color: #2c3e50 !important;
            border-color: #2c3e50 !important;
        }
        .btn-outline-primary:hover {
            background: linear-gradient(180deg, #2c3e50 0%, #34495e 100%) !important;
            color: white !important;
        }
        .btn-outline-secondary {
            color: #2c3e50 !important;
            border-color: #2c3e50 !important;
        }
        .btn-outline-secondary:hover {
            background: linear-gradient(180deg, #2c3e50 0%, #34495e 100%) !important;
            color: white !important;
        }
        .card-header.bg-primary {
            background: linear-gradient(180deg, #2c3e50 0%, #34495e 100%) !important;
        }
        .navbar-dark.bg-primary {
            background: linear-gradient(180deg, #2c3e50 0%, #34495e 100%) !important;
        }
        /* Hover effects for all buttons */
        .btn-primary:hover, .btn-success:hover, .btn-info:hover, .btn-warning:hover, .btn-secondary:hover, .btn-danger:hover, .btn-dark:hover {
            background: linear-gradient(180deg, #34495e 0%, #2c3e50 100%) !important;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(44, 62, 80, 0.3);
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-dark bg-primary navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('index') }}">
                <i class="fas fa-hospital me-2"></i>Hospital Management System
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="{{ url_for('index') }}">
                    <i class="fas fa-arrow-left me-1"></i>Back to Dashboard
                </a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">
                            <i class="fas fa-edit me-2"></i>Edit Appointment
                        </h4>
                    </div>
                    <div class="card-body">
                        <form method="POST">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="patient_id" class="form-label">Patient *</label>
                                    <select class="form-select" id="patient_id" name="patient_id" required>
                                        <option value="">Select Patient</option>
                                        {% for patient in patients %}
                                        <option value="{{ patient.id }}" {% if patient.id == appointment.patient_id %}selected{% endif %}>
                                            {{ patient.name }} ({{ patient.age }})
                                        </option>
                                        {% endfor %}
                                    </select>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="doctor_id" class="form-label">Doctor *</label>
                                    <select class="form-select" id="doctor_id" name="doctor_id" required>
                                        <option value="">Select Doctor</option>
                                        {% for doctor in doctors %}
                                        <option value="{{ doctor.id }}" {% if doctor.id == appointment.doctor_id %}selected{% endif %}>
                                            {{ doctor.name }} ({{ doctor.specialization }})
                                        </option>
                                        {% endfor %}
                                    </select>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="date" class="form-label">Date *</label>
                                    <input type="date" class="form-control" id="date" name="date" 
                                           value="{{ appointment.date }}" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="time" class="form-label">Time</label>
                                    <input type="time" class="form-control" id="time" name="time" 
                                           value="{{ appointment.time or '' }}">
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="diagnosis" class="form-label">Diagnosis</label>
                                <textarea class="form-control" id="diagnosis" name="diagnosis" rows="3">{{ appointment.diagnosis or '' }}</textarea>
                            </div>
                            <div class="mb-3">
                                <label for="notes" class="form-label">Notes</label>
                                <textarea class="form-control" id="notes" name="notes" rows="3">{{ appointment.notes or '' }}</textarea>
                            </div>
                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-save me-2"></i>Update Appointment
                                </button>
                                <a href="{{ url_for('index') }}" class="btn btn-secondary">
                                    <i class="fas fa-times me-2"></i>Cancel
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Set minimum date to today
        document.getElementById('date').min = new Date().toISOString().split('T')[0];
    </script>
</body>
</html>
