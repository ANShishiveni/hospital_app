<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Doctor - Hospital Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* Consistent gradient color scheme */
        .bg-primary, .btn-primary {
            background: linear-gradient(180deg, #2c3e50 0%, #34495e 100%) !important;
            border-color: #2c3e50 !important;
        }
        .bg-success, .btn-success {
            background: linear-gradient(180deg, #2c3e50 0%, #34495e 100%) !important;
            border-color: #2c3e50 !important;
        }
        .bg-info, .btn-info {
            background: linear-gradient(180deg, #2c3e50 0%, #34495e 100%) !important;
            border-color: #2c3e50 !important;
        }
        .bg-warning, .btn-warning {
            background: linear-gradient(180deg, #2c3e50 0%, #34495e 100%) !important;
            border-color: #2c3e50 !important;
        }
        .bg-secondary, .btn-secondary {
            background: linear-gradient(180deg, #2c3e50 0%, #34495e 100%) !important;
            border-color: #2c3e50 !important;
        }
        .bg-danger, .btn-danger {
            background: linear-gradient(180deg, #2c3e50 0%, #34495e 100%) !important;
            border-color: #2c3e50 !important;
        }
        .bg-dark, .btn-dark {
            background: linear-gradient(180deg, #2c3e50 0%, #34495e 100%) !important;
            border-color: #2c3e50 !important;
        }
        .btn-outline-primary {
            color: #2c3e50 !important;
            border-color: #2c3e50 !important;
        }
        .btn-outline-primary:hover {
            background: linear-gradient(180deg, #2c3e50 0%, #34495e 100%) !important;
            color: white !important;
        }
        .btn-outline-secondary {
            color: #2c3e50 !important;
            border-color: #2c3e50 !important;
        }
        .btn-outline-secondary:hover {
            background: linear-gradient(180deg, #2c3e50 0%, #34495e 100%) !important;
            color: white !important;
        }
        .card-header.bg-primary {
            background: linear-gradient(180deg, #2c3e50 0%, #34495e 100%) !important;
        }
        .navbar-dark.bg-primary {
            background: linear-gradient(180deg, #2c3e50 0%, #34495e 100%) !important;
        }
        /* Hover effects for all buttons */
        .btn-primary:hover, .btn-success:hover, .btn-info:hover, .btn-warning:hover, .btn-secondary:hover, .btn-danger:hover, .btn-dark:hover {
            background: linear-gradient(180deg, #34495e 0%, #2c3e50 100%) !important;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(44, 62, 80, 0.3);
        }
    </style>
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('index') }}">
                <i class="fas fa-hospital me-2"></i>Hospital Management System
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="{{ url_for('index') }}">Dashboard</a>
                <a class="nav-link" href="{{ url_for('add_patient') }}">Add Patient</a>
                <a class="nav-link" href="{{ url_for('add_appointment') }}">Schedule Appointment</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow">
                    <div class="card-header bg-success text-white">
                        <h4 class="mb-0">
                            <i class="fas fa-user-md me-2"></i>Add New Doctor
                        </h4>
                    </div>
                    <div class="card-body">
                        <form method="POST" action="{{ url_for('add_doctor') }}">
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="name" class="form-label">Doctor Name *</label>
                                        <input type="text" class="form-control" id="name" name="name" required>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="license_number" class="form-label">License Number *</label>
                                        <input type="text" class="form-control" id="license_number" name="license_number" required>
                                    </div>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="specialization" class="form-label">Specialization *</label>
                                        <select class="form-select" id="specialization" name="specialization" required>
                                            <option value="">Select Specialization</option>
                                            <option value="Cardiology">Cardiology</option>
                                            <option value="Neurology">Neurology</option>
                                            <option value="Pediatrics">Pediatrics</option>
                                            <option value="Orthopedics">Orthopedics</option>
                                            <option value="Dermatology">Dermatology</option>
                                            <option value="Oncology">Oncology</option>
                                            <option value="Psychiatry">Psychiatry</option>
                                            <option value="General Medicine">General Medicine</option>
                                            <option value="Emergency Medicine">Emergency Medicine</option>
                                            <option value="Surgery">Surgery</option>
                                            <option value="Radiology">Radiology</option>
                                            <option value="Pathology">Pathology</option>
                                            <option value="Anesthesiology">Anesthesiology</option>
                                            <option value="Obstetrics & Gynecology">Obstetrics & Gynecology</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="experience_years" class="form-label">Years of Experience</label>
                                        <input type="number" class="form-control" id="experience_years" name="experience_years" 
                                               min="0" max="50">
                                    </div>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="contact_number" class="form-label">Contact Number</label>
                                        <input type="tel" class="form-control" id="contact_number" name="contact_number" 
                                               placeholder="+1-555-0123">
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="email" class="form-label">Email Address</label>
                                        <input type="email" class="form-control" id="email" name="email" 
                                               placeholder="doctor@hospital.com">
                                    </div>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="education" class="form-label">Education & Qualifications</label>
                                <textarea class="form-control" id="education" name="education" rows="3" 
                                          placeholder="Enter educational background, degrees, certifications..."></textarea>
                            </div>

                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-success btn-lg">
                                    <i class="fas fa-save me-2"></i>Add Doctor
                                </button>
                                <a href="{{ url_for('index') }}" class="btn btn-outline-secondary">
                                    <i class="fas fa-arrow-left me-2"></i>Back to Dashboard
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
